name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: U-Monitor
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on Ubuntu 24.04; glibc-compatible with Ubuntu 24 and 26.
          - os: ubuntu-24.04
            artifact: u-monitor-linux-x86_64
          - os: windows-latest
            artifact: u-monitor-windows-x86_64
          - os: macos-latest
            artifact: u-monitor-macos-universal
    steps:
      - uses: actions/checkout@v7
        with:
          path: U-Monitor
          persist-credentials: false

      - name: Validate U-Library source
        shell: bash
        env:
          U_LIBRARY_REPOSITORY: ${{ vars.U_LIBRARY_REPOSITORY }}
          U_LIBRARY_REVISION: ${{ vars.U_LIBRARY_REVISION }}
        run: |
          if [[ ! "$U_LIBRARY_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ||
                ! "$U_LIBRARY_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Set U_LIBRARY_REPOSITORY (owner/repo) and U_LIBRARY_REVISION (full commit SHA)."
            exit 1
          fi

      - name: Check out pinned U-Library
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.U_LIBRARY_REPOSITORY }}
          ref: ${{ vars.U_LIBRARY_REVISION }}
          token: ${{ secrets.U_LIBRARY_READ_TOKEN || github.token }}
          path: U-Library
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.90.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: U-Monitor

      - name: Linux GUI build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Release build
        if: runner.os != 'macOS'
        run: |
          cargo build --locked --release -p u-monitor-ui
          cargo build --locked --release -p u-monitor-ffi

      - name: Build both macOS architectures
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin -p u-monitor-ui -p u-monitor-ffi
          cargo build --locked --release --target aarch64-apple-darwin -p u-monitor-ui -p u-monitor-ffi

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/u-monitor dist/
          cp target/release/libu_monitor.so dist/
          cp crates/u-monitor-ffi/include/u_monitor.h dist/
          cp LICENSE-MIT LICENSE-APACHE README.md CHANGELOG.md dist/
          tar -C dist -czf "${{ matrix.artifact }}.tar.gz" .

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/u-monitor.exe dist/
          Copy-Item target/release/u_monitor.dll dist/
          Copy-Item crates/u-monitor-ffi/include/u_monitor.h dist/
          Copy-Item LICENSE-MIT,LICENSE-APACHE,README.md,CHANGELOG.md dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          for binary in u-monitor libu_monitor.dylib; do
            lipo -create "target/x86_64-apple-darwin/release/$binary" "target/aarch64-apple-darwin/release/$binary" -output "dist/$binary"
            lipo -verify_arch x86_64 arm64 "dist/$binary"
          done
          cp crates/u-monitor-ffi/include/u_monitor.h dist/
          cp LICENSE-MIT LICENSE-APACHE README.md CHANGELOG.md dist/
          tar -C dist -czf "${{ matrix.artifact }}.tar.gz" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: U-Monitor/${{ matrix.artifact }}.*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
