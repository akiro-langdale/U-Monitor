name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: u-monitor-linux-x86_64
          - os: windows-latest
            artifact: u-monitor-windows-x86_64
          - os: macos-latest
            artifact: u-monitor-macos-universal
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.90.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Linux GUI build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Release build
        run: cargo build --release -p u-monitor-ui -p u-monitor-ffi

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/u-monitor dist/
          cp target/release/libu_monitor.so dist/
          cp crates/u-monitor-ffi/include/u_monitor.h dist/
          cp LICENSE-MIT LICENSE-APACHE README.md CHANGELOG.md dist/
          tar -C dist -czf "${{ matrix.artifact }}.tar.gz" .

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/u-monitor.exe dist/
          Copy-Item target/release/u_monitor.dll dist/
          Copy-Item crates/u-monitor-ffi/include/u_monitor.h dist/
          Copy-Item LICENSE-MIT,LICENSE-APACHE,README.md,CHANGELOG.md dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp target/release/u-monitor dist/
          cp target/release/libu_monitor.dylib dist/
          cp crates/u-monitor-ffi/include/u_monitor.h dist/
          cp LICENSE-MIT LICENSE-APACHE README.md CHANGELOG.md dist/
          tar -C dist -czf "${{ matrix.artifact }}.tar.gz" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            *.tar.gz
            *.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
