[workspace]
members = [
    "crates/u-monitor-core",
    "crates/u-monitor-platform",
    "crates/u-monitor-telemetry",
    "crates/u-monitor-simulation",
    "crates/u-monitor-ffi",
    "crates/u-monitor-ui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
thiserror = "1.0"

sysinfo = { version = "=0.37.2", default-features = false, features = ["system"] }
