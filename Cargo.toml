[workspace]
members = [
    "crates/u-monitor-core",
    "crates/u-monitor-platform",
    "crates/u-monitor-telemetry",
    "crates/u-monitor-simulation",
    "crates/u-monitor-ffi",
    "crates/u-monitor-ui",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/akiro-langdale/U-Monitor"
readme = "README.md"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi", "std"] }

sysinfo = { version = "=0.37.2", default-features = false, features = ["system", "disk"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
# Unwinding is kept so FFI entry points can map panics to UM_ERR_INTERNAL.
