[package]
name = "u-monitor-ffi"
version.workspace = true
edition.workspace = true
description = "Stable C ABI for U-Monitor platform and simulation APIs"
license = "MIT OR Apache-2.0"

[lib]
name = "u_monitor"
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
u-monitor-core = { path = "../u-monitor-core" }
u-monitor-platform = { path = "../u-monitor-platform" }
u-monitor-simulation = { path = "../u-monitor-simulation" }
